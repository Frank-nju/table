server {
    listen 80;
    # Replace _ with your domain name or the server's public IP address.
    # for example: server_name cac.example.com;
    # for example: server_name 123.45.67.89;
    server_name _;

    client_max_body_size 2m;

    # To enable HTTPS, use Certbot to request a certificate:
    #   sudo apt install certbot python3-certbot-nginx
    #   sudo certbot --nginx -d cac.example.com
    # Certbot will update this file with the required SSL settings.

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        access_log off;
    }
}

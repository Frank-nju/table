# /etc/nginx/sites-available/cac — reverse proxy in front of gunicorn on 127.0.0.1:8000.
# Get a certificate with: sudo certbot --nginx -d cac.example.edu
server {
    listen 80;
    server_name cac.example.edu;   # change me

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets never change, so they can be cached for a long time.
    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

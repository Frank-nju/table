name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres, mysql]
    services:
      postgres:
        image: ${{ matrix.database == 'postgres' && 'postgres:16' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cac_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cac_test
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -proot" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        if: matrix.database == 'sqlite'
        run: |
          ruff check app tests migrations
          ruff format --check app tests migrations
          mypy app
      - name: Migrations match the models
        if: matrix.database == 'sqlite'
        run: |
          DATABASE_URL=sqlite:///./ci.db python -m app.cli migrate
          DATABASE_URL=sqlite:///./ci.db alembic check
      - name: Tests
        env:
          TEST_DATABASE_URL: >-
            ${{ matrix.database == 'postgres' && 'postgresql+psycopg://postgres:postgres@127.0.0.1:5432/cac_test'
             || matrix.database == 'mysql' && 'mysql+pymysql://root:root@127.0.0.1:3306/cac_test?charset=utf8mb4'
             || '' }}
        run: pytest --cov=app --cov-report=term-missing:skip-covered

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: python -m venv .venv && .venv/bin/pip install -e .
      - name: Install frontend
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: End-to-end tests
        working-directory: frontend
        run: npx playwright test
